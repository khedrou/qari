<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قارئ الكتب</title>
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1319" media="(prefers-color-scheme: dark)">
<meta name="description" content="قارئ كتب PDF كيعرض النص على قياس الشاشة مع تحكم ف الإضاءة والخط والثيمات">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="قارئ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Literata:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <main id="lib" class="screen">
    <header class="lib-head">
      <div>
        <h1>قارئ الكتب</h1>
        <small id="count"></small>
      </div>
      <label class="btn" for="file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        فتح كتاب
      </label>
    </header>
    <div class="lib-body">
      <label class="empty" id="empty" for="file" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8M8 11h6"/></svg>
        <strong>ما عندك حتى كتاب</strong>
        <span>اختار ملف PDF باش تبدا القراءة. التطبيق كينسخ النص ويعرضو على قياس الشاشة، والكتب كتبقى محفوظة ف هاد الجهاز.</span>
      </label>
      <div class="list" id="list"></div>
    </div>
  </main>

  <section id="reader" data-rt="paper" hidden>
    <div id="pager"><div id="flow" class="txt"></div></div>
    <div id="scroller" hidden><div id="sflow" class="txt"></div></div>
    <div id="scans" hidden></div>
    <div id="foot"><span id="f-title"></span><span id="f-pct"></span></div>

    <div class="bar" id="top" hidden>
      <button class="ibtn" id="back" aria-label="رجوع للمكتبة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <div class="title" id="title"></div>
      <button class="ibtn" id="bm" aria-pressed="false" aria-label="علامة مرجعية">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3h11v18l-5.5-4-5.5 4z"/></svg>
      </button>
      <button class="ibtn" id="open-toc" aria-label="الفهرس والعلامات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button class="ibtn" id="open-set" aria-label="إعدادات القراءة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>

    <div class="bar" id="bottom" dir="rtl" hidden>
      <button class="ibtn pn" id="prev" aria-label="السابق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <input id="slider" type="range" min="0" max="1000" value="0" aria-label="التنقل ف الكتاب">
      <span id="sl-pct">0%</span>
      <button class="ibtn nx" id="next" aria-label="التالي">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div id="scrim" hidden></div>

    <div id="sheet" class="sheet" hidden role="dialog" aria-label="إعدادات القراءة">
      <div class="grip"></div>
      <div class="sh-head">
        <h3>إعدادات القراءة</h3>
        <button class="ibtn" id="close-set" aria-label="سدّ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="grp">
        <div class="row"><span>الإضاءة</span><output id="o-bright"></output></div>
        <input type="range" id="r-bright" min="20" max="100" step="1" aria-label="الإضاءة">
        <div class="row" style="margin-top:10px"><span>تقليل الضوء الأزرق</span><output id="o-warm"></output></div>
        <input type="range" id="r-warm" min="0" max="100" step="1" aria-label="تقليل الضوء الأزرق">
      </div>

      <div class="grp">
        <div class="row"><span>الثيم</span></div>
        <div class="themes" id="themes"></div>
      </div>

      <div class="grp" id="g-text">
        <div class="row"><span>طريقة القراءة</span></div>
        <div class="chips" id="c-mode"></div>
        <div class="row" style="margin-top:14px"><span>نوع الخط</span></div>
        <div class="chips" id="c-ff"></div>
      </div>

      <div class="grp" id="g-size">
        <div class="row"><span>حجم الخط</span><output id="o-fs"></output></div>
        <input type="range" id="r-fs" min="14" max="44" step="1" aria-label="حجم الخط">
        <div class="row" style="margin-top:10px"><span>تباعد الأسطر</span><output id="o-lh"></output></div>
        <input type="range" id="r-lh" min="1.3" max="2.6" step="0.1" aria-label="تباعد الأسطر">
        <div class="row" style="margin-top:10px"><span>الهوامش</span><output id="o-pad"></output></div>
        <input type="range" id="r-pad" min="8" max="52" step="2" aria-label="الهوامش">
      </div>

      <div class="grp" id="g-just">
        <div class="row"><span>محاذاة النص</span></div>
        <div class="chips" id="c-just"></div>
        <div class="row" style="margin-top:14px"><span>اتجاه تقليب الصفحات</span></div>
        <div class="chips" id="c-flip"></div>
      </div>

      <div class="grp">
        <label class="chk"><span>خلّي الشاشة مفتوحة أثناء القراءة</span><input type="checkbox" id="k-awake"></label>
      </div>
    </div>

    <div id="tsheet" class="sheet" hidden role="dialog" aria-label="الفهرس والعلامات">
      <div class="grip"></div>
      <div class="sh-head">
        <div class="tabs" role="group" aria-label="القائمة">
          <button id="t-toc" aria-pressed="true">الفهرس</button>
          <button id="t-bm" aria-pressed="false">العلامات</button>
        </div>
        <button class="ibtn" id="close-t" aria-label="سدّ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="t-list"></div>
    </div>
  </section>
</div>

<div id="dim"></div>
<div id="warm"></div>
<div id="loading" hidden>كنحمّل…</div>
<div id="prep" hidden>
  <div class="card" role="status" aria-live="polite">
    <h3>كنحضّر الكتاب</h3>
    <div class="bar-track"><div class="bar-fill" id="prep-fill" style="width:0%"></div></div>
    <p id="prep-txt">كننسخ النص ونرتّبو</p>
    <p>هادشي كيوقع غير أول مرة، من بعد الكتاب كيتحل بسرعة.</p>
    <button id="prep-cancel" type="button">إلغاء</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" class="sr" accept="application/pdf,.pdf">

<script type="module">
import * as pdfjs from './lib/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = new URL('./lib/pdf.worker.min.mjs', import.meta.url).href;
window.pdfjsLib = pdfjs;
</script>
<script src="app.js"></script>
</body>
</html>
